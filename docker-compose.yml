# 本地：docker compose up --build
# 服务器：由 GitHub Actions 推送源码后在 /opt/robustor 执行 docker compose up -d --build
services:
  app:
    image: robustor:local
    build:
      context: .
    container_name: robustor
    ports:
      - "${APP_PORT:-8888}:8888"
    environment:
      RB_PORT: "8888"
      LAYOUT_PROVIDER: ${LAYOUT_PROVIDER:-mock}
      OCR_PROVIDER: ${OCR_PROVIDER:-mock}
      # 只在需要真实 VLM 识别时提供；不要写进镜像
      VLM_API_KEY: ${VLM_API_KEY:-}
      VLM_BASE_URL: ${VLM_BASE_URL:-}
      VLM_MODEL: ${VLM_MODEL:-}
      # Key 加密主密钥；留空则在 data/secret.key 自动生成并持久化
      RB_SECRET_KEY: ${RB_SECRET_KEY:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
