name: build-and-deploy

# 推送 main → 构建镜像 → 推到镜像仓库 → SSH 到腾讯云主机 docker compose 拉取重启。
#
# 需要的 Repository secrets：
#   REGISTRY_USERNAME / REGISTRY_PASSWORD  镜像仓库账号（腾讯云 TCR 用「访问管理」里的 API 密钥）
#   DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY / DEPLOY_PATH（服务器上的 compose 目录）
#   DEPLOY_PORT（可选，默认 22）
# 需要的 Repository variables：
#   REGISTRY      如 ghcr.io 或 ccr.ccs.tencentyun.com
#   IMAGE_NAME    如 <namespace>/robustor（腾讯云写法：<命名空间>/robustor）
#   APP_PORT      主机映射端口，默认 8888

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY || 'ghcr.io' }}
  IMAGE_NAME: ${{ vars.IMAGE_NAME || 'robustor' }}
  APP_PORT: ${{ vars.APP_PORT || '8888' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "${{ secrets.REGISTRY_PASSWORD }}" | docker login ${{ env.REGISTRY }} \
              -u "${{ secrets.REGISTRY_USERNAME }}" --password-stdin
            export IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
            export APP_PORT="${{ env.APP_PORT }}"
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
            curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" && echo "healthy"
