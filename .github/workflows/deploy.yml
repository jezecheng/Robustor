name: build-and-deploy

# 推送 main → 构建镜像并推到 GHCR → SSH 到腾讯云主机（110.42.255.249，用户 ubuntu）
# → 写入 /opt/robustor/docker-compose.yml → docker compose pull && up -d。
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   Secrets（必填）
#     DEPLOY_SSH_KEY   ubuntu 用户的 SSH 私钥（例如 ~/.ssh/id_ed25519 的内容）
#   Secrets（可选）
#     DEPLOY_PORT      默认 22
#     GHCR_TOKEN       若 GHCR 镜像包为私有，需一个带 read:packages 权限的 PAT；
#                      把镜像包设为 Public 后可省略
#     VLM_API_KEY      启用真实 VLM 识别时提供
#   Variables（可选）
#     VLM_BASE_URL / VLM_MODEL / LAYOUT_PROVIDER / OCR_PROVIDER / APP_PORT
#
# 服务器前置条件：
#   1. ubuntu 用户可免密 sudo，且已安装 docker + docker compose 插件
#   2. 腾讯云安全组放行 8888/TCP
#   3. /opt/robustor 首次由本工作流创建并 chown 给 ubuntu

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/robustor
  APP_PORT: ${{ vars.APP_PORT || '8888' }}
  DEPLOY_HOST: 110.42.255.249
  DEPLOY_USER: ubuntu
  DEPLOY_PATH: /opt/robustor

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare remote directory
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            sudo mkdir -p "${{ env.DEPLOY_PATH }}"
            sudo chown -R "${{ env.DEPLOY_USER }}" "${{ env.DEPLOY_PATH }}"

      - name: Upload compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ env.DEPLOY_PATH }}
          overwrite: true

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          APP_PORT: ${{ env.APP_PORT }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          VLM_API_KEY: ${{ secrets.VLM_API_KEY }}
          VLM_BASE_URL: ${{ vars.VLM_BASE_URL }}
          VLM_MODEL: ${{ vars.VLM_MODEL }}
          LAYOUT_PROVIDER: ${{ vars.LAYOUT_PROVIDER }}
          OCR_PROVIDER: ${{ vars.OCR_PROVIDER }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE,APP_PORT,GHCR_USER,GHCR_TOKEN,VLM_API_KEY,VLM_BASE_URL,VLM_MODEL,LAYOUT_PROVIDER,OCR_PROVIDER
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            if ! sudo docker compose version >/dev/null 2>&1; then
              echo "服务器缺少 docker compose 插件，请先安装：sudo apt install docker-compose-plugin" >&2
              exit 1
            fi

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            fi

            sudo env \
              IMAGE="$IMAGE" \
              APP_PORT="$APP_PORT" \
              VLM_API_KEY="$VLM_API_KEY" \
              VLM_BASE_URL="$VLM_BASE_URL" \
              VLM_MODEL="$VLM_MODEL" \
              LAYOUT_PROVIDER="$LAYOUT_PROVIDER" \
              OCR_PROVIDER="$OCR_PROVIDER" \
              docker compose pull

            sudo env \
              IMAGE="$IMAGE" \
              APP_PORT="$APP_PORT" \
              VLM_API_KEY="$VLM_API_KEY" \
              VLM_BASE_URL="$VLM_BASE_URL" \
              VLM_MODEL="$VLM_MODEL" \
              LAYOUT_PROVIDER="$LAYOUT_PROVIDER" \
              OCR_PROVIDER="$OCR_PROVIDER" \
              docker compose up -d --remove-orphans

            sudo docker image prune -f
            curl -fsS "http://127.0.0.1:${APP_PORT}/api/health" && echo "healthy"
